<!doctype html><html><head><meta charset=utf-8><meta name=robots content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=style.css><script src=reviews.js></script><style>.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.c{flex:0 0 min(320px,85%);scroll-snap-align:start;padding:20px}.av{width:36px;height:36px;border-radius:50%;background:#C79248;color:#0B1626;display:grid;place-items:center;font-weight:700}.top{display:flex;gap:10px;align-items:center}</style></head><body><div class=wrap><span class=tag>DESIGN 3</span><h1>Glass card carousel</h1><p class=note>Swipeable cards, snap scrolling. <b class=ex>EXAMPLE DATA — NOT REAL REVIEWS</b></p><div class=row id=k></div><p><span class=g></span> <a href=#>All reviews on Google →</a></p></div>
<script>k.innerHTML=R.map(r=>'<div class="glass c"><div class=top><div class=av>'+r[0].slice(-1)+'</div><div><b>'+r[0]+'</b><div class=note>Google · date</div></div></div><div class=stars style="margin-top:10px">★★★★★</div><p>'+r[1]+'</p></div>').join('')</script></body></html>
