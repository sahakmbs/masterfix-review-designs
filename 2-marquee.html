<!doctype html><html><head><meta charset=utf-8><meta name=robots content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=style.css><script src=reviews.js></script><style>.strip{overflow:hidden;border-block:1px solid rgba(199,146,72,.3);padding:12px 0;mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}.track{display:flex;gap:14px;width:max-content;animation:m 40s linear infinite}.c{width:300px;padding:12px 14px;font-size:13px}.c p{margin:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}@keyframes m{to{transform:translateX(-50%)}}.head{display:flex;gap:10px;align-items:center;margin-bottom:12px}</style></head><body><div class=wrap><span class=tag>DESIGN 2</span><h1>Slim auto-scrolling strip</h1><p class=note>Thin band under the hero; pauses on hover. <b class=ex>EXAMPLE DATA — NOT REAL REVIEWS</b></p><div class=head><span class=g></span><b>X.X</b><span class=stars>★★★★★</span><span class=note>NN reviews on Google</span><a href=#>Read on Google →</a></div></div><div class=strip><div class=track id=k></div></div>
<script>k.innerHTML=[...R,...R].map(r=>'<div class="glass c"><span class=stars>★★★★★</span><p>'+r[1]+'</p><span class=note>'+r[0]+'</span></div>').join('')</script></body></html>
