<!doctype html><html><head><meta charset=utf-8><meta name=robots content="noindex,nofollow"><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href=style.css><script src=reviews.js></script><style>.grid{display:grid;grid-template-columns:240px repeat(3,1fr);gap:14px}.s{padding:20px;text-align:center}.big{font-size:44px;font-weight:800;color:#C79248}.c{padding:16px;font-size:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class=wrap><span class=tag>DESIGN 4</span><h1>Rating summary + 3 cards</h1><p class=note>Compact section above the footer. <b class=ex>EXAMPLE DATA — NOT REAL REVIEWS</b></p><div class=grid id=k><div class="glass s"><span class=g></span><div class=big>X.X</div><div class=stars>★★★★★</div><div class=note>NN Google reviews</div><p><a href=#>Leave a review</a></p></div></div></div>
<script>k.innerHTML+=R.slice(0,3).map(r=>'<div class="glass c"><span class=stars>★★★★★</span><p>'+r[1]+'</p><b>'+r[0]+'</b></div>').join('')</script></body></html>
